services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-howdy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-howdy}
      POSTGRES_DB: ${POSTGRES_DB:-interview_coach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-howdy} -d ${POSTGRES_DB:-interview_coach}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
