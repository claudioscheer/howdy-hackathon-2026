name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stage:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://howdy:howdy@localhost:5432/interview_coach
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: howdy
          POSTGRES_PASSWORD: howdy
          POSTGRES_DB: interview_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howdy -d interview_coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            command: pnpm run format:check
          - name: build / typecheck
            command: pnpm run build
          - name: lint
            command: pnpm run lint
          - name: unit tests + coverage (full)
            command: pnpm run test:all
          - name: harness evals
            command: pnpm run harness
            browser: false
          - name: browser journey
            command: pnpm run test:e2e
            browser: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.browser
        run: pnpm prisma migrate deploy && pnpm prisma db seed
      - run: ${{ matrix.command }}
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_ALL: "1"
          DATABASE_URL: postgresql://howdy:howdy@localhost:5432/interview_coach
          PRACTICE_LIVE_EVALUATOR: "0"

  verify:
    name: verify
    needs: [stage]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All parallel verification stages passed."
